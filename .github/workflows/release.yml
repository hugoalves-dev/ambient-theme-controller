name: Build, test and release

# Pull requests into dev/main only build and test.
# Every push to dev (commit or merged PR) publishes a pre-release tagged v0.1.<run>-dev.
# Every push to main (commit or merged PR) publishes a release tagged v0.1.<run>, marked as latest.
# Changes that touch only documentation do not run the workflow at all.
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE-*'
      - 'NOTICE'
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'LICENSE-*'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release in progress; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Test and analyze
        working-directory: android
        run: |
          flutter pub get
          flutter test
          flutter analyze
      - name: Build Android app (debug-signed, experimental)
        working-directory: android
        run: |
          flutter build apk --release --target-platform android-arm64 --build-name "$VERSION" --build-number "${{ github.run_number }}"
          mkdir -p ../release-assets
          cp build/app/outputs/flutter-apk/app-release.apk ../release-assets/ambient-theme-android-arm64.apk
      - name: Kotlin unit tests (the Gradle wrapper is generated by the Flutter build)
        working-directory: android/android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release-assets/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Windows solution
        run: dotnet test windows/AmbientTheme.slnx --configuration Release
      - name: Publish portable Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish windows/src/AmbientTheme.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:Version=$env:VERSION -o app-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Move-Item -LiteralPath app-publish/AmbientThemeController.exe -Destination release-assets/ambient-theme-controller-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/*.exe
          if-no-files-found: error

  release:
    needs: [android, windows]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            tag="v${VERSION}"
            channel=(--latest)
            title="$tag"
          else
            tag="v${VERSION}-dev"
            channel=(--prerelease --latest=false)
            title="$tag (pre-release from dev)"
          fi

          # A re-run reuses the run number: never move or overwrite an existing tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          cd release-assets
          sha256sum *.apk *.exe > SHA256SUMS.txt
          gh release create "$tag" "${channel[@]}" \
            --target "$TARGET_SHA" \
            --title "$title" \
            --generate-notes \
            --notes "Built from \`$BRANCH\` at $TARGET_SHA. The Android APK is signed with a debug key (no production signing identity yet)." \
            *.apk *.exe SHA256SUMS.txt
