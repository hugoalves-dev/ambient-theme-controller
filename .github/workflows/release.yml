name: Build, test and release

# Pushes and pull requests only build and test. A GitHub Release is published
# only when this workflow is started manually (Actions > Run workflow).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Test and analyze
        working-directory: poc/android-sensor
        run: |
          flutter pub get
          flutter test
          flutter analyze
      - name: Test and analyze the Android app
        working-directory: android
        run: |
          flutter pub get
          flutter test
          flutter analyze
          cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build Android app (debug-signed, experimental)
        working-directory: android
        run: |
          flutter build apk --release --target-platform android-arm64 --build-name "0.1.${{ github.run_number }}" --build-number "${{ github.run_number }}"
          mkdir -p ../release-assets
          cp build/app/outputs/flutter-apk/app-release.apk ../release-assets/ambient-theme-android-arm64.apk
      - name: Build ARM64 APK
        working-directory: poc/android-sensor
        run: flutter build apk --release --target-platform android-arm64 --build-name "0.1.${{ github.run_number }}" --build-number "${{ github.run_number }}"
      - name: Collect APK
        run: |
          mkdir -p release-assets
          cp poc/android-sensor/build/app/outputs/flutter-apk/app-release.apk release-assets/ambient-sensor-poc-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release-assets/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Windows PoC
        run: dotnet test poc/windows-theme/tests/ThemeProbe.Tests.csproj --configuration Release
      - name: Test Windows solution
        run: dotnet test windows/AmbientTheme.slnx --configuration Release
      - name: Publish portable Windows x64 executables
        shell: pwsh
        run: |
          dotnet publish poc/windows-theme/ThemeProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -LiteralPath release-assets/ThemeProbe.exe -Destination release-assets/ambient-theme-poc-windows-x64.exe
          dotnet publish windows/src/AmbientTheme.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o app-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -LiteralPath app-publish/AmbientThemeController.exe -Destination release-assets/ambient-theme-controller-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/*.exe
          if-no-files-found: error

  release:
    needs: [android, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.${RUN_NUMBER}"
          cd release-assets
          sha256sum *.apk *.exe > SHA256SUMS.txt
          gh release create "$tag" --target "$TARGET_SHA" --title "$tag — experimental builds" --prerelease --notes "Experimental builds, not the finished MVP. Android APK is signed with a debug key. Source commit: $TARGET_SHA." *.apk *.exe SHA256SUMS.txt
