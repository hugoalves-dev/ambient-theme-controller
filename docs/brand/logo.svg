<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Ambient Theme — sun and moon</title>
  <!--
    Source of truth for the logo and the splash animation. The Avalonia LogoMark control and the Android
    vector drawables (ic_splash_logo / avd_splash_logo) reproduce this geometry on a 120x120 canvas:
    8 rays around (60,60), sun r=30, moon r=24 resting at (76,48). Splash: rays turn, the sun breathes and the
    moon glides in from the right until it covers the sun's upper-right edge (day turning into night).
  -->
  <defs>
    <radialGradient id="sun" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F5A524"/>
    </radialGradient>
  </defs>
  <g id="rays" fill="#F5A524">
    <rect x="56" y="4" width="8" height="16" rx="4"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(45 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(90 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(135 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(180 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(225 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(270 60 60)"/>
    <rect x="56" y="4" width="8" height="16" rx="4" transform="rotate(315 60 60)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="12s" repeatCount="indefinite"/>
  </g>
  <circle cx="60" cy="60" r="30" fill="url(#sun)">
    <animate attributeName="r" values="28;30;28" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle id="moon" cx="76" cy="48" r="24" fill="#141821">
    <animate attributeName="cx" from="112" to="76" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0 1" keyTimes="0;1"/>
  </circle>
</svg>
